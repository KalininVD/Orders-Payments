<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders & Payments Test Client</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>
    <h1>Тестовый клиент API</h1>

    <div class="container">
        <div class="card">
            <h2>Шаг 1: Пользователь и Счет</h2>
            <label for="userId">UserID:</label>
            <input type="text" id="userId" value="3fa85f64-5717-4562-b3fc-2c963f66afa6">
            <button id="createAccountBtn">Создать счет</button>
            <button id="checkBalanceBtn">Проверить баланс</button>
            <br><br>
            <label for="depositAmount">Сумма пополнения:</label>
            <input type="number" id="depositAmount" value="1000">
            <button id="depositBtn">Пополнить счет</button>
        </div>

        <div class="card">
            <h2>Шаг 2: Заказ</h2>
            <label for="orderAmount">Сумма заказа:</label>
            <input type="number" id="orderAmount" value="150">
            <label for="orderDescription">Описание:</label>
            <input type="text" id="orderDescription" value="Резиновая уточка">
            <button id="createOrderBtn">Создать заказ</button>
        </div>
    </div>

    <h2>Логи</h2>
    <div id="log-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="js/app.js"></script>
</body>
</html>
